<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>Expositores · Plataforma de Eventos TIC</title>
<link rel="icon" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/fonts/fuentes.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/print.css">
<script src="../assets/js/tema.js"></script>
</head>
<body data-pantalla="admin-expositores" data-base="../" data-titulo="Expositores">

<div class="app">
  <div class="app__body">
    <main class="main" id="contenido">
      <div class="view view--wide stack stack--4">

        <div class="row row--between" style="align-items:flex-end">
          <div class="stack stack--2">
            <span class="kicker">Administrador</span>
            <h1>Propuestas de exposición</h1>
            <p class="help">Cada propuesta llega desde el preregistro. Al aprobarla se agenda y el expositor recibe su carnet con el rótulo correspondiente.</p>
          </div>
          <div class="row" id="filtros-estado" role="group" aria-label="Filtrar por estado"></div>
        </div>

        <div class="grid-4" id="kpis"></div>

        <div class="table">
          <div class="table__scroll">
            <div class="table__grid" style="min-width:820px">
              <div class="table__head cols-expositores">
                <span>Propuesta</span><span>Expositor</span><span>Categoría</span>
                <span>Jornada</span><span>Estado</span>
              </div>
              <div id="filas"></div>
            </div>
          </div>
          <div class="table__foot"><span id="conteo"></span><span>Agenda pública en agenda.html</span></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="../assets/js/ui.js"></script>
<script src="../assets/js/datos-demo.js"></script>
<script src="../assets/js/qr.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/paginas/expositores.js"></script>
</body>
</html>
